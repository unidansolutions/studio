<style>
#aiChatBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #0077ff;
  color: white;
  padding: 18px;
  border-radius: 50%;
  font-size: 28px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  z-index: 9999;
}
#aiChat {
  position: fixed;
  bottom: 100px;
  right: 20px;
  width: 340px;
  height: 480px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  display: none;
  flex-direction: column;
  overflow: hidden;
  z-index: 9999;
}
#aiChatHeader {
  background: #0077ff;
  color: white;
  padding: 15px;
  font-size: 17px;
  font-weight: bold;
}
#aiChatMsg {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
  background: #f4f4f4;
}
.msg {
  padding: 10px;
  margin: 8px 0;
  border-radius: 10px;
  font-size: 14px;
  max-width: 80%;
}
.bot { background: #dce9ff; }
.user { background: #d1ffd1; margin-left: auto; }
#aiChatInputBox {
  padding: 10px;
  display: flex;
  background: white;
  border-top: 1px solid #ccc;
}
#aiInput {
  flex: 1;
  padding: 8px;
  border: 1px solid #aaa;
  border-radius: 8px;
}
#aiSendBtn {
  margin-left: 6px;
  background: #0077ff;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
}
</style>

<div id="aiChatBtn">💬</div>

<div id="aiChat">
  <div id="aiChatHeader">Assistente Virtuale Demo</div>
  <div id="aiChatMsg"></div>
  <div id="aiChatInputBox">
    <input id="aiInput" type="text" placeholder="Scrivi qualcosa...">
    <button id="aiSendBtn">Invia</button>
  </div>
</div>

<script>
const aiBtn = document.getElementById("aiChatBtn");
const aiChat = document.getElementById("aiChat");
const aiMsg = document.getElementById("aiChatMsg");
const aiInput = document.getElementById("aiInput");
const aiSend = document.getElementById("aiSendBtn");

aiBtn.onclick = () => {
  aiChat.style.display = aiChat.style.display === "flex" ? "none" : "flex";
  if (aiMsg.innerHTML.trim() === "") welcome();
};

function addMsg(text, sender="bot") {
  aiMsg.innerHTML += `<div class="msg ${sender}">${text}</div>`;
  aiMsg.scrollTop = aiMsg.scrollHeight;
}

function welcome() {
  addMsg("Ciao! 👋 Sono un assistente demo e posso rispondere a QUALSIASI tua domanda. Chiedimi pure!");
}

aiSend.onclick = sendUserMsg;
aiInput.addEventListener("keydown", e => { if (e.key === "Enter") sendUserMsg(); });

function sendUserMsg() {
  const text = aiInput.value.trim();
  if (!text) return;
  addMsg(text, "user");
  aiInput.value = "";
  setTimeout(() => aiRespond(text), 300);
}

function aiRespond(text) {
  const t = text.toLowerCase();

  // 🔍 RISPOSTE REALISTICHE BASATE SU PAROLE CHIAVE
  if (t.includes("orari")) return addMsg("Siamo aperti dal lunedì al venerdì, dalle 9:00 alle 19:00. 😊");
  if (t.includes("dove") || t.includes("indirizzo")) return addMsg("Ci trovi in Via Esempio 123, facilmente raggiungibile!");
  if (t.includes("visita")) return addMsg("Disponiamo di visite generali, specialistiche, controlli e molto altro.");
  if (t.includes("dolore") || t.includes("male")) return addMsg("Mi dispiace 😟. Ti consiglio di prenotare una visita il prima possibile.");
  if (t.includes("prenot")) return addMsg("Posso aiutarti! Dimmi giorno e orario che preferisci.");
  if (t.includes("costo") || t.includes("prezzo") || t.includes("quanto")) return addMsg("I prezzi variano in base al tipo di visita, ma partono da circa €50.");
  if (t.includes("document") || t.includes("cosa serve")) return addMsg("Di solito basta carta d'identità, tessera sanitaria ed eventuali esami precedenti.");

  // 🤖 RISPOSTE CASUALI INTELLIGENTI (PER MOSTRARE AVANZATEZZA)
  const randomResponses = [
    "Interessante! Puoi dirmi qualcosa di più?",
    "Capito 👍. Vuoi maggiori informazioni?",
    "Ho elaborato la tua richiesta: posso aiutarti con orari, costi, prenotazioni o informazioni generiche.",
    "Ottimo! Se vuoi posso darti più dettagli.",
    "Va bene! Puoi continuare, ti sto ascoltando 😊",
    "Ok! Se vuoi posso cercare informazioni per te."
  ];

  const random = randomResponses[Math.floor(Math.random() * randomResponses.length)];
  addMsg(random);
}
</script>
