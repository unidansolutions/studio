<style>
body {
  margin: 0;
  background-image: url('https://i.imgur.com/Hltnf0O.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  font-family: Arial, sans-serif;
}
</style>


<!-- ============================
      CHATBOT BUTTON
============================= -->
<style>
#aiChatBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #0077ff;
  color: white;
  padding: 18px;
  border-radius: 50%;
  font-size: 28px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  z-index: 999999;
}
</style>

<div id="aiChatBtn">💬</div>


<!-- ============================
        CHATBOT BOX
============================= -->
<style>
#aiChat {
  position: fixed;
  bottom: 100px;
  right: 20px;
  width: 360px;
  height: 520px;
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(6px);
  border-radius: 15px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  display: none;
  flex-direction: column;
  overflow: hidden;
  z-index: 999999;
}

/* Header */
#aiChatHeader {
  background: rgba(0, 119, 255, 0.92);
  color: white;
  padding: 15px;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
}

/* Messages area */
#aiChatMsg {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
  background: rgba(255,255,255,0.85);
}

/* Messages */
.msg {
  padding: 10px;
  margin: 8px 0;
  border-radius: 12px;
  font-size: 14px;
  max-width: 80%;
  line-height: 1.4;
}
.bot { background: #dce9ff; }
.user { background: #c6ffd1; margin-left: auto; }

/* Input section */
#aiChatInputBox {
  padding: 10px;
  display: flex;
  background: white;
  border-top: 1px solid #ccc;
}
#aiInput {
  flex: 1;
  padding: 8px;
  border: 1px solid #aaa;
  border-radius: 8px;
}
#aiSendBtn {
  margin-left: 6px;
  background: #0077ff;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
}
</style>


<!-- ============================
       CHATBOT CONTAINER
============================= -->
<div id="aiChat">
  <div id="aiChatHeader">Studio Medico Demo</div>
  <div id="aiChatMsg"></div>
  <div id="aiChatInputBox">
    <input id="aiInput" type="text" placeholder="Scrivi qualcosa...">
    <button id="aiSendBtn">Invia</button>
  </div>
</div>


<!-- ============================
         CHATBOT LOGIC
============================= -->
<script>
const aiBtn = document.getElementById("aiChatBtn");
const aiChat = document.getElementById("aiChat");
const aiMsg = document.getElementById("aiChatMsg");
const aiInput = document.getElementById("aiInput");
const aiSend = document.getElementById("aiSendBtn");

aiBtn.onclick = () => {
  aiChat.style.display = aiChat.style.display === "flex" ? "none" : "flex";
  if (aiMsg.innerHTML.trim() === "") welcomeMessage();
};

function addMsg(text, sender="bot") {
  aiMsg.innerHTML += `<div class="msg ${sender}">${text}</div>`;
  aiMsg.scrollTop = aiMsg.scrollHeight;
}

function welcomeMessage() {
  addMsg(`
  <b>Benvenuto nello Studio Medico Demo! 🦷</b><br><br>

  <b>🏥 Nome Studio:</b> Studio Medico San Marco<br><br>

  <b>🕒 Orari:</b><br>
  Lun–Ven 8:30–19:00<br>
  Sab 9:00–13:00<br><br>

  <b>📍 Indirizzo:</b><br>
  Via Esempio 42, Milano<br><br>

  <b>🌍 Google Maps:</b><br>
  <a href="https://www.google.com/maps?q=Via Esempio 42 Milano" target="_blank">Apri Maps</a><br><br>

  <b>🔧 Prestazioni:</b><br>
  • Visita generale<br>
  • Visita specialistica<br>
  • Pulizia dentale<br>
  • Sbiancamento<br>
  • Ortopanoramica<br>
  • Ecografie<br>
  • Check-up completo<br><br>

  <b>💰 Costi indicativi:</b><br>
  • Prima visita: €50<br>
  • Controllo: €40<br>
  • Pulizia dentale: €60<br>
  • Sbiancamento: €150–€250<br><br>

  <b>📞 Telefono:</b> +39 02 0000 0000<br>
  <b>📧 Email:</b> info@studiomedicodemo.it<br><br>

  Come posso aiutarti oggi? 😊
  `);
}

/* INVIO MESSAGGIO */
aiSend.onclick = sendUserMsg;
aiInput.addEventListener("keydown", e => { if (e.key === "Enter") sendUserMsg(); });

function sendUserMsg() {
  const text = aiInput.value.trim();
  if (!text) return;
  addMsg(text, "user");
  aiInput.value = "";
  setTimeout(() => aiRespond(text.toLowerCase()), 300);
}

function aiRespond(t) {

  /* ===============================
        RISPOSTE CASUALI INTELLIGENTI
  =============================== */

  // ORARI CASUALI
  if (t.includes("orari") || t.includes("aperti") || t.includes("quando")) {
    const randomHours = [
      "Oggi siamo aperti dalle 8:00 alle 18:30.",
      "Siamo aperti 9:00–19:00 senza pausa.",
      "Domani aperti solo 8:30–13:00.",
      "Per urgenze rispondiamo 24/7!"
    ];
    return addMsg(randomHours[Math.floor(Math.random()*randomHours.length)]);
  }

  // NUMERO TELEFONO CASUALE
  if (t.includes("telefono") || t.includes("numero") || t.includes("contatto")) {
    const fakeNumber = "+39 3" + Math.floor(100000000 + Math.random()*900000000);
    return addMsg("Ecco un numero diretto: <b>" + fakeNumber + "</b>");
  }

  // EMAIL CASUALE
  if (t.includes("email") || t.includes("mail")) {
    const fakeEmail = "info" + Math.floor(Math.random()*99) + "@studio-medico.it";
    return addMsg("Puoi scriverci a: <b>" + fakeEmail + "</b>");
  }

  // INFORMAZIONI GENERALI
  if (t.includes("info") || t.includes("informazioni") || t.includes("come funziona")) {
    const info = [
      "Offriamo visite diagnostiche, controlli e trattamenti personalizzati.",
      "Lo studio fornisce servizi completi di prevenzione, analisi e cura.",
      "Ogni visita include anamnesi e valutazione clinica dettagliata.",
      "Disponiamo anche di consulti online, se preferisci non venire in studio."
    ];
    return addMsg(info[Math.floor(Math.random()*info.length)]);
  }

  // PRENOTAZIONI
  if (t.includes("prenot")) {
    return addMsg("Perfetto! Dimmi giorno, orario e tipo di visita e preparo la richiesta.");
  }

  // PREZZI CASUALI
  if (t.includes("prezzo") || t.includes("costo") || t.includes("quanto")) {
    const randomCost = [
      "Una visita costa circa €50.",
      "Dipende dal tipo di visita, mediamente €40–€70.",
      "Per questo trattamento il costo medio è €120.",
      "Posso darti un preventivo preciso se mi dici la visita."
    ];
    return addMsg(randomCost[Math.floor(Math.random()*randomCost.length)]);
  }

  // RISPOSTE GENERICHE INTELLIGENTI
  const generalResponses = [
    "Chiaro! Vuoi approfondire?",
    "Interessante, dimmi pure 😊",
    "Perfetto, sono qui!",
    "Va bene! Vuoi orari, prezzi o info servizi?",
    "Posso aiutarti con informazioni mediche, costi o prenotazioni."
  ];

  addMsg(generalResponses[Math.floor(Math.random()*generalResponses.length)]);
}
</script>
